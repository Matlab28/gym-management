spring:
  docker:
    compose:
      enabled: false
  application:
    name: gym-management
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/gym_management
    username: postgres
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  jms:
    pub-sub-domain: false
    template:
      delivery-mode: persistent
  h2:
    console:
      enabled: false
      path: /h2-console
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@example.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  jwt:
    secret: ${JWT_SECRET:IhOKpzNEWKKpkQXoOLDCVdJ7zSKXtavXbPidtf+kFSETu5r2de7jhjO5ntlUvgc0+ZP2w2y1KIXuCZNNCjtPQw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  messaging:
    workload-queue: ${WORKLOAD_QUEUE:trainer.workload.events}
  openapi:
    gym-server-url: ${OPENAPI_GYM_SERVER_URL:/}
    workload-server-url: ${OPENAPI_WORKLOAD_SERVER_URL:/workload}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Gym Management API
        url: /v3/api-docs
      - name: Trainer Workload API
        url: /workload/v3/api-docs
    urls-primary-name: Gym Management API
    custom-css-url: /swagger-ui-custom.css
    display-request-duration: true
    doc-expansion: none
    filter: true
    operations-sorter: alpha
    persist-authorization: true
    tags-sorter: alpha
    try-it-out-enabled: true

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  #    include: '*'
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

server:
  shutdown: immediate

logging:
  level:
    com.epam.gymmanagement: INFO
    org.springframework.boot.actuator.autoconfigure.opentelemetry: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){magenta} %clr(%-5level) %clr([%X{transactionId}]){cyan} %clr(%logger{36}){blue} %clr(-){faint} %msg%n"

kind: Application

# Separate configuration for different environments - logging
