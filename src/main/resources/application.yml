spring:
  application:
    name: gym-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

security:
  jwt:
    secret: ${JWT_SECRET:IhOKpzNEWKKpkQXoOLDCVdJ7zSKXtavXbPidtf+kFSETu5r2de7jhjO5ntlUvgc0+ZP2w2y1KIXuCZNNCjtPQw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

---

spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:gym}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: ${H2_CONSOLE_WEB_ALLOW_OTHERS:false}
