services:
  activemq:
    image: apache/activemq:6.2.8
    restart: unless-stopped
    environment:
      ACTIVEMQ_CONNECTION_USER: gym_app
      ACTIVEMQ_CONNECTION_PASSWORD: ${ACTIVEMQ_PASSWORD}
      ACTIVEMQ_WEB_USER: admin
      ACTIVEMQ_WEB_PASSWORD: ${ACTIVEMQ_PASSWORD}
      ACTIVEMQ_OPTS_MEMORY: -Xms64M -Xmx256M
    volumes:
      - activemq-data:/opt/activemq/data
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/61616'"]
      interval: 10s
      timeout: 5s
      retries: 18

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym_management
      POSTGRES_USER: gym_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_app -d gym_management"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery:
    build:
      context: .
      dockerfile: runtime.Dockerfile
      args:
        JAR_FILE: artifacts/discovery-server.jar
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx160m
    mem_limit: 224m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18

  trainer-workload:
    build:
      context: .
      dockerfile: runtime.Dockerfile
      args:
        JAR_FILE: artifacts/trainer-workload-service.jar
    restart: unless-stopped
    environment:
      TRAINER_WORKLOAD_PORT: 8081
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_DEFAULT_ZONE: http://discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USER: gym_app
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      JMS_CONSUMER_CONCURRENCY: 2-6
      OPENAPI_GYM_SERVER_URL: /
      OPENAPI_WORKLOAD_SERVER_URL: /workload
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    mem_limit: 320m
    depends_on:
      activemq:
        condition: service_healthy
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18

  gym-management:
    build:
      context: .
      dockerfile: runtime.Dockerfile
      args:
        JAR_FILE: artifacts/gym-management.jar
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      PROD_DB_URL: jdbc:postgresql://postgres:5432/gym_management
      PROD_DB_USERNAME: gym_app
      PROD_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EUREKA_DEFAULT_ZONE: http://discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USER: gym_app
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      OPENAPI_GYM_SERVER_URL: /
      OPENAPI_WORKLOAD_SERVER_URL: /workload
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx448m
    mem_limit: 576m
    depends_on:
      activemq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      trainer-workload:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 24

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 48m
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs:/usr/share/nginx/html/docs:ro
    depends_on:
      gym-management:
        condition: service_healthy
      trainer-workload:
        condition: service_healthy

volumes:
  activemq-data:
  postgres-data:
