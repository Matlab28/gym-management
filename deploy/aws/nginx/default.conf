server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    location = / {
        return 302 /docs/;
    }

    location = /docs {
        return 302 /docs/;
    }

    location /docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /docs/index.html;
    }

    location /workload/ {
        rewrite ^/workload/(.*)$ /$1 break;
        proxy_pass http://trainer-workload:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /workload;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://gym-management:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
